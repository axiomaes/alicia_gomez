  <!-- Letra A -->
  <path class="gold" d="M100 30 L60 150 L75 150 L85 120 L115 120 L125 150 L140 150 L100 30 Z M90 105 L100 70 L110 105 Z"/>

  <!-- Balanza -->
  <line x1="100" y1="70" x2="100" y2="120" class="gold thin"/>
  <line x1="70" y1="80" x2="130" y2="80" class="gold thin"/>

  <!-- Cadenas -->
  <line x1="70" y1="80" x2="60" y2="105" class="gold thin"/>
  <line x1="70" y1="80" x2="80" y2="105" class="gold thin"/>
  <line x1="130" y1="80" x2="120" y2="105" class="gold thin"/>
  <line x1="130" y1="80" x2="140" y2="105" class="gold thin"/>

  <!-- Platos -->
  <ellipse cx="70" cy="110" rx="12" ry="4" class="gold thin"/>
  <ellipse cx="130" cy="110" rx="12" ry="4" class="gold thin"/>
</svg>