<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gold Gradient for the circular seal -->
    <linearGradient id="goldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="30%" stop-color="#F3E5AB" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>
    
    <!-- Subtle shadow for the white scales to give it a premium 3D look like the PNG -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer ring (dark brown/black circular border) -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#2c1a0c" stroke-width="3" />
  
  <!-- Outer thin gold ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Main gold seal background -->
  <circle cx="100" cy="100" r="85" fill="url(#goldGrad)" stroke="#2c1a0c" stroke-width="2" />

  <!-- Inner thin ring for a premium coin/seal look -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />

  <!-- Scales of Justice (White, crisp vector art with subtle shadow) -->
  <g filter="url(#subtleShadow)">
    <!-- Central Pillar/Base -->
    <!-- Base of the scale -->
    <path d="M 70 148 Q 100 142 130 148 L 130 142 Q 100 140 70 142 Z" fill="#ffffff" />
    <path d="M 85 142 L 115 142 L 111 138 L 89 138 Z" fill="#ffffff" />
    <!-- Vertical Column -->
    <path d="M 97 138 L 97 70 Q 100 66 103 70 L 103 138 Z" fill="#ffffff" />
    <!-- Top Ornament/Tip -->
    <circle cx="100" cy="62" r="4" fill="#ffffff" />
    
    <!-- Beam (Curved horizontal crossbar) -->
    <!-- Center connector -->
    <path d="M 94 72 Q 100 68 106 72 L 106 76 Q 100 74 94 76 Z" fill="#ffffff" />
    <!-- Left half of beam with elegant curl at end -->
    <path d="M 100 74 Q 72 74 62 82 Q 58 85 62 89 Q 65 91 67 87 Q 69 82 78 80 Q 90 78 100 76" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <!-- Right half of beam with elegant curl at end -->
    <path d="M 100 74 Q 128 74 138 82 Q 142 85 138 89 Q 135 91 133 87 Q 131 82 122 80 Q 110 78 100 76" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />

    <!-- Left Scale Pan -->
    <!-- Hanging Strings/Chains -->
    <line x1="62" y1="86" x2="48" y2="120" stroke="#ffffff" stroke-width="1.2" />
    <line x1="62" y1="86" x2="76" y2="120" stroke="#ffffff" stroke-width="1.2" />
    <!-- The Pan -->
    <path d="M 46 120 L 78 120 Q 78 128 62 128 Q 46 128 46 120" fill="#ffffff" />
    <!-- Pan Rim/Base details -->
    <line x1="46" y1="120" x2="78" y2="120" stroke="#f0f0f0" stroke-width="0.8" />

    <!-- Right Scale Pan -->
    <!-- Hanging Strings/Chains -->
    <line x1="138" y1="86" x2="124" y2="120" stroke="#ffffff" stroke-width="1.2" />
    <line x1="138" y1="86" x2="152" y2="120" stroke="#ffffff" stroke-width="1.2" />
    <!-- The Pan -->
    <path d="M 122 120 L 154 120 Q 154 128 138 128 Q 122 128 122 120" fill="#ffffff" />
    <!-- Pan Rim/Base details -->
    <line x1="122" y1="120" x2="154" y2="120" stroke="#f0f0f0" stroke-width="0.8" />
  </g>
</svg>
